name: Python tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m forex_agent demo --scenario news --json
      - run: python -m forex_agent backtest --data examples/agent-replay.synthetic.json --out /tmp/agent-replay.json
      - run: python -m forex_agent backtest --data examples/backtest.synthetic.json --strategy sma --out /tmp/sma-replay.json
      - run: python -m forex_agent train --data examples/backtest.synthetic.json --pair EUR/USD --timeframe M5 --out /tmp/model.json
      - run: python -m forex_agent predict --model /tmp/model.json --data examples/backtest.synthetic.json
      - run: python -m compileall -q forex_agent
